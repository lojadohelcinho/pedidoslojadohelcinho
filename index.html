<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Helcinho - Perfumaria e Presentes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creme: '#FDF9F5',
                        rosegold: '#D49B85',
                        marromCafe: '#3E2723',
                        verdePetroleo: '#008B74',
                        verdeHover: '#006D5B'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        cocomatStyle: ['"Montserrat"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-creme text-marromCafe font-sans min-h-screen flex flex-col">

    <!-- Header Principal -->
    <header class="sticky top-0 z-40 bg-creme/95 backdrop-blur border-b border-rosegold/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full border border-rosegold overflow-hidden bg-white shadow-inner flex items-center justify-center">
                    <img src="logohelcinho.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div>
                    <h1 class="font-cocomatStyle font-extrabold text-base sm:text-lg uppercase tracking-wider text-marromCafe">LOJA DO HELCINHO</h1>
                    <p class="text-[10px] text-rosegold uppercase tracking-widest font-semibold">Perfumaria & Presentes</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="toggleCart()" class="relative bg-verdePetroleo hover:bg-verdeHover text-white p-2.5 rounded-full shadow transition flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-creme hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Barra de Busca e Filtros -->
    <div class="max-w-7xl mx-auto px-4 py-4 w-full">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full sm:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar produto..." class="w-full bg-white border border-rosegold/30 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-verdePetroleo shadow-sm">
            </div>
            <div id="category-filters" class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                <button onclick="setCategory('todos')" id="cat-todos" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-verdePetroleo text-white shadow-sm transition whitespace-nowrap">Todos</button>
            </div>
        </div>
    </div>

    <!-- Vitrine de Produtos -->
    <main class="max-w-7xl mx-auto px-4 py-2 flex-grow w-full mb-16">
        <div id="loading-spinner" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-verdePetroleo"></i>
            <p class="text-sm text-gray-500 mt-2">A carregar catálogo da nuvem...</p>
        </div>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-4xl text-rosegold mb-3"></i>
            <p class="text-marromCafe font-medium">Nenhum produto encontrado na nuvem.</p>
        </div>
    </main>

    <!-- Sacola Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-creme shadow-2xl flex flex-col">
                <div class="p-4 bg-white border-b border-rosegold/20 flex items-center justify-between">
                    <h2 id="cart-title" class="font-bold text-base text-marromCafe">Sacola (0 produtos)</h2>
                    <button onclick="toggleCart()" class="text-gray-400 hover:text-marromCafe p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="p-4 bg-white border-b border-rosegold/10">
                    <label class="block text-xs font-semibold mb-1 text-marromCafe">Seu Nome Completo *</label>
                    <input type="text" id="cliente-nome" placeholder="Digite seu nome para o pedido" class="w-full bg-creme border border-rosegold/30 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-verdePetroleo">
                </div>
                <div class="bg-verdePetroleo/10 px-4 py-3 border-b border-verdePetroleo/20 flex items-center gap-3">
                    <i class="fa-solid fa-gift text-verdePetroleo text-lg"></i>
                    <label class="text-xs font-medium text-marromCafe cursor-pointer flex items-center gap-2">
                        <input type="checkbox" id="is-gift" class="accent-verdePetroleo w-4 h-4 rounded">
                        Seu pedido é um presente? Embalagem especial
                    </label>
                </div>
                <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 bg-white border-t border-rosegold/20 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-600">Subtotal:</span>
                        <span id="cart-subtotal" class="font-bold text-lg text-marromCafe">R$ 0,00</span>
                    </div>
                    <button id="btn-finalizar" onclick="checkoutWhatsApp()" class="w-full bg-verdePetroleo hover:bg-verdeHover text-white font-semibold py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        Finalizar Pedido via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-rosegold/20 py-6 text-center text-xs text-gray-500">
        <p>© 2026 Loja do Helcinho. Todos os direitos reservados.</p>
    </footer>

    <!-- Lógica Conectada ao Supabase -->
    <script>
        const SUPABASE_URL = 'https://xslatpupelivsxxodtpg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5mfnRVIWm0WGT4fD0Zqzhw_Ucl8zTtT';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ZAP_PADRAO = '5516981035241';

        let products = [];
        let cart = [];
        let currentCategory = 'todos';
        let zapLoja = ZAP_PADRAO;

        // Escapa texto vindo do banco antes de colocar no HTML
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function fmtBRL(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

        // WhatsApp da loja vem do painel (nuvem), igual para todos os visitantes
        async function carregarWhatsApp() {
            try {
                const { data, error } = await supabaseClient.from('configuracoes').select('valor').eq('id', 'whatsapp').maybeSingle();
                if (!error && data && data.valor) zapLoja = String(data.valor).replace(/\D/g, '') || ZAP_PADRAO;
            } catch (e) { console.error('WhatsApp da loja:', e); }
        }

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient.from('produtos').select('*');
                if (error) {
                    console.error("Erro ao buscar produtos do Supabase:", error);
                    products = [];
                } else {
                    products = data || [];
                }
            } catch (err) {
                console.error("Erro de ligação:", err);
                products = [];
            }
            document.getElementById('loading-spinner').classList.add('hidden');
            updateCategories();
            renderProducts();
        }

        function updateCategories() {
            const activeProducts = products.filter(p => p.ativo !== false);
            const cats = ['todos', ...new Set(activeProducts.map(p => p.categoria).filter(Boolean))];
            if (!cats.includes(currentCategory)) currentCategory = 'todos';
            const container = document.getElementById('category-filters');
            container.innerHTML = cats.map(cat => {
                const label = cat.charAt(0).toUpperCase() + cat.slice(1);
                const isActive = currentCategory === cat;
                const activeClass = isActive ? "bg-verdePetroleo text-white shadow-sm" : "bg-white border border-rosegold/30 text-marromCafe hover:bg-rosegold/10";
                return `<button data-cat="${esc(cat)}" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold ${activeClass} transition whitespace-nowrap">${esc(label)}</button>`;
            }).join('');
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-cat]');
            if (btn) setCategory(btn.dataset.cat);
        });

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const search = document.getElementById('search-input').value.toLowerCase();

            const filtered = products.filter(p => {
                if (p.ativo === false) return false;
                const matchCat = currentCategory === 'todos' || (p.categoria && p.categoria.toLowerCase() === currentCategory.toLowerCase());
                const matchSearch = (p.nome && p.nome.toLowerCase().includes(search)) || (p.descricao && p.descricao.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl border border-rosegold/20 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div class="relative bg-gray-50 p-4 flex items-center justify-center h-48">
                        ${p.preco_antigo ? `<span class="absolute top-2 left-2 bg-emerald-800 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">Promoção</span>` : ''}
                        <img src="${esc(p.imagem || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500')}" alt="${esc(p.nome)}" class="h-full object-contain">
                    </div>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-rosegold">${esc(p.categoria || 'Geral')}</span>
                            <h3 class="font-bold text-sm text-marromCafe uppercase mt-0.5">${esc(p.nome)}</h3>
                            <p class="text-xs text-gray-500 line-clamp-2 mt-0.5">${esc(p.descricao || '')}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-100 flex items-end justify-between">
                            <div>
                                ${p.preco_antigo ? `<span class="text-[10px] text-gray-400 line-through block">${fmtBRL(p.preco_antigo)}</span>` : ''}
                                <span class="font-bold text-base text-marromCafe">${fmtBRL(p.preco)}</span>
                            </div>
                            <button onclick="addToCart(${Number(p.id)})" class="bg-verdePetroleo hover:bg-verdeHover text-white w-9 h-9 rounded-xl flex items-center justify-center shadow transition">
                                <i class="fa-solid fa-bag-shopping text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            updateCategories();
            renderProducts();
        }

        function filterProducts() { renderProducts(); }
        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('hidden'); renderCartItems(); }

        function addToCart(id) {
            const product = products.find(p => p.id == id);
            if (!product) return;
            const existing = cart.find(item => item.id == id);
            if (existing) existing.qtd += 1;
            else cart.push({ ...product, qtd: 1 });
            updateBadge();
            toggleCart();
        }

        function updateQtd(id, delta) {
            const item = cart.find(i => i.id == id);
            if (!item) return;
            item.qtd += delta;
            if (item.qtd <= 0) cart = cart.filter(i => i.id != id);
            renderCartItems();
            updateBadge();
        }

        function updateBadge() {
            const totalQtd = cart.reduce((acc, item) => acc + item.qtd, 0);
            const badge = document.getElementById('cart-badge');
            if (totalQtd > 0) { badge.textContent = totalQtd; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
            document.getElementById('cart-title').textContent = `Sacola (${totalQtd} ${totalQtd === 1 ? 'produto' : 'produtos'})`;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('cart-subtotal');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">Sua sacola está vazia.</div>`;
                subtotalEl.textContent = 'R$ 0,00';
                return;
            }
            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                subtotal += (item.preco || 0) * item.qtd;
                return `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-rosegold/20 shadow-xs">
                        <img src="${esc(item.imagem || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500')}" class="w-14 h-14 object-contain bg-gray-50 rounded-lg p-1">
                        <div class="flex-grow">
                            <h4 class="font-bold text-xs text-marromCafe uppercase">${esc(item.nome)}</h4>
                            <p class="text-xs text-gray-500">${fmtBRL(item.preco)}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                                    <button onclick="updateQtd(${Number(item.id)}, -1)" class="px-2 py-0.5 bg-gray-50 text-gray-600 text-xs">-</button>
                                    <span class="px-2.5 text-xs font-bold">${item.qtd}</span>
                                    <button onclick="updateQtd(${Number(item.id)}, 1)" class="px-2 py-0.5 bg-gray-50 text-gray-600 text-xs">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.textContent = fmtBRL(subtotal);
        }

        let enviando = false;
        async function checkoutWhatsApp() {
            if (enviando) return;
            if (cart.length === 0) return alert('Sua sacola está vazia!');

            const nomeCliente = document.getElementById('cliente-nome').value.trim();
            if (!nomeCliente) {
                alert('Por favor, digite o seu nome antes de finalizar o pedido!');
                document.getElementById('cliente-nome').focus();
                return;
            }

            enviando = true;
            const btn = document.getElementById('btn-finalizar');
            btn.disabled = true;
            btn.classList.add('opacity-60');

            // Abre a aba do WhatsApp AGORA (no clique), senão o celular bloqueia o pop-up depois do envio
            const janelaZap = window.open('', '_blank');

            try {
                const isGift = document.getElementById('is-gift').checked;
                const numeroPedido = 'PED-' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase();

                let subtotal = 0;
                cart.forEach(item => { subtotal += (item.preco || 0) * item.qtd; });
                const produtosDescricao = cart.map(i => `${i.qtd}x ${i.nome}`).join(', ');
                const agora = new Date();
                const dataTxt = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

                // Itens enxutos (sem a imagem) para o painel calcular ranking e lucro
                const itens = cart.map(i => ({
                    id: i.id,
                    nome: i.nome,
                    categoria: i.categoria || 'Geral',
                    preco: Number(i.preco || 0),
                    qtd: i.qtd
                }));

                // Grava o pedido na nuvem: é daqui que o painel (qualquer aparelho) lê
                let salvou = true;
                try {
                    const { error } = await supabaseClient.from('pedidos').insert([{
                        id: numeroPedido,
                        cliente: nomeCliente,
                        produtos: produtosDescricao,
                        itensdetalhados: itens,
                        valortotal: subtotal,
                        formapagamento: 'WhatsApp / Pix',
                        status: 'Novo',
                        presente: isGift ? 'Sim' : 'Não',
                        data: dataTxt
                    }]);
                    if (error) { salvou = false; console.error('Erro ao registrar pedido:', error); }
                } catch (err) {
                    salvou = false;
                    console.error('Erro ao registrar pedido:', err);
                }

                if (!salvou) {
                    alert('Não conseguimos registrar o pedido no sistema agora, mas você ainda pode enviá-lo pelo WhatsApp.');
                }

                let text = `*🛍️ PEDIDO #${numeroPedido} - LOJA DO HELCINHO*\n`;
                text += `👤 *Cliente:* ${nomeCliente}\n\n`;
                cart.forEach(item => {
                    text += `• ${item.qtd}x *${item.nome}* - ${fmtBRL((item.preco || 0) * item.qtd)}\n`;
                });
                if (isGift) text += `\n🎁 *Embalagem para Presente:* Solicitada\n`;
                text += `\n💰 *Total:* ${fmtBRL(subtotal)}\n\nOlá, gostaria de confirmar este pedido!`;

                const url = `https://wa.me/${zapLoja}?text=${encodeURIComponent(text)}`;
                if (janelaZap) janelaZap.location.href = url;
                else window.location.href = url;

                cart = [];
                updateBadge();
                toggleCart();
            } finally {
                enviando = false;
                btn.disabled = false;
                btn.classList.remove('opacity-60');
            }
        }

        // Atualiza o catálogo sozinho quando você altera algo no painel
        function ligarTempoReal() {
            let timer = null;
            supabaseClient.channel('site-produtos')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, () => {
                    clearTimeout(timer);
                    timer = setTimeout(fetchProducts, 400);
                })
                .subscribe();
        }

        carregarWhatsApp();
        fetchProducts();
        ligarTempoReal();
    </script>
</body>
</html>
