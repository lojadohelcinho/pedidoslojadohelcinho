<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Helcinho - Perfumaria e Presentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creme: '#FDF9F5',
                        rosegold: '#D49B85',
                        marromCafe: '#3E2723',
                        verdePetroleo: '#008B74',
                        verdeHover: '#006D5B'
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-creme text-marromCafe font-sans min-h-screen flex flex-col">

    <!-- Header (Sem o banner vermelho e sem o botão de Admin) -->
    <header class="sticky top-0 z-40 bg-creme/95 backdrop-blur border-b border-rosegold/20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border border-rosegold flex items-center justify-center bg-white shadow-inner">
                    <i class="fa-solid fa-spray-can-sparkles text-rosegold text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-marromCafe">Loja do Helcinho</h1>
                    <p class="text-[10px] text-rosegold uppercase tracking-widest font-semibold">Perfumaria & Presentes</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <!-- Botão da Sacola -->
                <button onclick="toggleCart()" class="relative bg-verdePetroleo hover:bg-verdeHover text-white p-2.5 rounded-full shadow transition flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-creme hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Busca e Filtros -->
    <div class="max-w-7xl mx-auto px-4 py-4 w-full">
        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="relative w-full sm:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar perfume..." class="w-full bg-white border border-rosegold/30 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-verdePetroleo shadow-sm">
            </div>
            <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0">
                <button onclick="setCategory('todos')" id="cat-todos" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-verdePetroleo text-white shadow-sm transition whitespace-nowrap">Todos</button>
                <button onclick="setCategory('Masculino')" id="cat-Masculino" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-rosegold/30 text-marromCafe hover:bg-rosegold/10 transition whitespace-nowrap">Masculino</button>
                <button onclick="setCategory('Feminino')" id="cat-Feminino" class="category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-rosegold/30 text-marromCafe hover:bg-rosegold/10 transition whitespace-nowrap">Feminino</button>
            </div>
        </div>
    </div>

    <!-- Vitrine -->
    <main class="max-w-7xl mx-auto px-4 py-2 flex-grow w-full mb-16">
        <div id="loading-spinner" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-verdePetroleo"></i>
            <p class="text-sm text-gray-500 mt-2">Carregando catálogo...</p>
        </div>
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-4xl text-rosegold mb-3"></i>
            <p class="text-marromCafe font-medium">Nenhum produto encontrado.</p>
        </div>
    </main>

    <!-- Sacola Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-creme shadow-2xl flex flex-col">
                <div class="p-4 bg-white border-b border-rosegold/20 flex items-center justify-between">
                    <h2 id="cart-title" class="font-bold text-base text-marromCafe">Sacola (0 produtos)</h2>
                    <button onclick="toggleCart()" class="text-gray-400 hover:text-marromCafe p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="bg-verdePetroleo/10 px-4 py-3 border-b border-verdePetroleo/20 flex items-center gap-3">
                    <i class="fa-solid fa-gift text-verdePetroleo text-lg"></i>
                    <label class="text-xs font-medium text-marromCafe cursor-pointer flex items-center gap-2">
                        <input type="checkbox" id="is-gift" class="accent-verdePetroleo w-4 h-4 rounded">
                        Seu pedido é um presente? Embalagem especial
                    </label>
                </div>
                <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 bg-white border-t border-rosegold/20 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-600">Subtotal:</span>
                        <span id="cart-subtotal" class="font-bold text-lg text-marromCafe">R$ 0,00</span>
                    </div>
                    <button onclick="checkoutWhatsApp()" class="w-full bg-verdePetroleo hover:bg-verdeHover text-white font-semibold py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        Finalizar Pedido via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-rosegold/20 py-6 text-center text-xs text-gray-500">
        <p>© 2026 Loja do Helcinho. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Mantenha a sua URL real do Supabase aqui entre as aspas
        const SUPABASE_URL = 'SUA_URL_DO_SUPABASE';
        const SUPABASE_ANON_KEY = 'sb_publishable_5mfnRVIWm0WGT4fD0Zqzhw_Ucl8zTtT';
        
        let supabaseClient = null;
        try {
            if (SUPABASE_URL !== 'SUA_URL_DO_SUPABASE') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) { console.warn("Supabase não configurado."); }

        let products = [];
        let cart = [];
        let currentCategory = 'todos';

        const defaultProducts = [
            { id: 1, nome: "UOMINI", descricao: "Spirit Desodorante Colônia 100ml", preco: 103.90, preco_antigo: 209.90, categoria: "Masculino", imagem: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500", desconto: "-51%" },
            { id: 2, nome: "COFFEE", descricao: "Man Seduction Amadeirado 100ml", preco: 171.90, preco_antigo: 229.90, categoria: "Masculino", imagem: "https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500", desconto: "-25%" },
            { id: 3, nome: "214", descricao: "African Sunrise Eau De Parfum 75ml", preco: 189.90, preco_antigo: 239.90, categoria: "Feminino", imagem: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500", desconto: "-20%" },
            { id: 4, nome: "EGEO", descricao: "Dolce Desodorante Colônia 90ml", preco: 89.90, preco_antigo: 149.90, categoria: "Feminino", imagem: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?w=500", desconto: "-40%" }
        ];

        async function fetchProducts() {
            document.getElementById('loading-spinner').classList.remove('hidden');
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('produtos').select('*');
                    if (error) throw error;
                    products = data && data.length > 0 ? data : defaultProducts;
                } else {
                    products = defaultProducts;
                }
            } catch (err) {
                products = defaultProducts;
            }
            document.getElementById('loading-spinner').classList.add('hidden');
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'todos' || p.categoria === currentCategory;
                const matchSearch = p.nome.toLowerCase().includes(search) || p.descricao.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');
            grid.innerHTML = filtered.map(p => `
                <div class="bg-white rounded-2xl border border-rosegold/20 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div class="relative bg-gray-50 p-4 flex items-center justify-center h-48">
                        ${p.desconto ? `<span class="absolute top-2 left-2 bg-emerald-800 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">${p.desconto}</span>` : ''}
                        <img src="${p.imagem || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500'}" alt="${p.nome}" class="h-full object-contain">
                    </div>
                    <div class="p-3 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-rosegold">${p.categoria}</span>
                            <h3 class="font-bold text-sm text-marromCafe uppercase mt-0.5">${p.nome}</h3>
                            <p class="text-xs text-gray-500 line-clamp-2 mt-0.5">${p.descricao}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-gray-100 flex items-end justify-between">
                            <div>
                                ${p.preco_antigo ? `<span class="text-[10px] text-gray-400 line-through block">R$ ${Number(p.preco_antigo).toFixed(2).replace('.', ',')}</span>` : ''}
                                <span class="font-bold text-base text-marromCafe">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</span>
                            </div>
                            <button onclick="addToCart(${p.id})" class="bg-verdePetroleo hover:bg-verdeHover text-white w-9 h-9 rounded-xl flex items-center justify-center shadow transition">
                                <i class="fa-solid fa-bag-shopping text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white border border-rosegold/30 text-marromCafe hover:bg-rosegold/10 transition whitespace-nowrap";
            });
            const active = document.getElementById(`cat-${cat}`);
            if(active) active.className = "category-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-verdePetroleo text-white shadow-sm transition whitespace-nowrap";
            renderProducts();
        }

        function filterProducts() { renderProducts(); }
        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('hidden'); renderCartItems(); }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) existing.qtd += 1;
            else cart.push({ ...product, qtd: 1 });
            updateBadge();
            toggleCart();
        }

        function updateQtd(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qtd += delta;
            if (item.qtd <= 0) cart = cart.filter(i => i.id !== id);
            renderCartItems();
            updateBadge();
        }

        function updateBadge() {
            const totalQtd = cart.reduce((acc, item) => acc + item.qtd, 0);
            const badge = document.getElementById('cart-badge');
            if (totalQtd > 0) { badge.textContent = totalQtd; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
            document.getElementById('cart-title').textContent = `Sacola (${totalQtd} ${totalQtd === 1 ? 'produto' : 'produtos'})`;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('cart-subtotal');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400 text-sm">Sua sacola está vazia.</div>`;
                subtotalEl.textContent = 'R$ 0,00';
                return;
            }
            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                subtotal += item.preco * item.qtd;
                return `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-rosegold/20 shadow-xs">
                        <img src="${item.imagem}" class="w-14 h-14 object-contain bg-gray-50 rounded-lg p-1">
                        <div class="flex-grow">
                            <h4 class="font-bold text-xs text-marromCafe uppercase">${item.nome}</h4>
                            <p class="text-xs text-gray-500">R$ ${Number(item.preco).toFixed(2).replace('.', ',')}</p>
                            <div class="flex items-center gap-3 mt-2">
                                <div class="flex items-center border border-gray-200 rounded-lg overflow-hidden">
                                    <button onclick="updateQtd(${item.id}, -1)" class="px-2 py-0.5 bg-gray-50 text-gray-600 text-xs">-</button>
                                    <span class="px-2.5 text-xs font-bold">${item.qtd}</span>
                                    <button onclick="updateQtd(${item.id}, 1)" class="px-2 py-0.5 bg-gray-50 text-gray-600 text-xs">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            subtotalEl.textContent = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert('Sua sacola está vazia!');
            const whatsappNumber = localStorage.getItem('helcinho_whatsapp') || '5514999999999';
            const isGift = document.getElementById('is-gift').checked;
            let text = `*🛍️ NOVO PEDIDO - LOJA DO HELCINHO*\n\n`;
            let subtotal = 0;
            cart.forEach(item => {
                const totalItem = item.preco * item.qtd;
                subtotal += totalItem;
                text += `• ${item.qtd}x *${item.nome}* (${item.descricao}) - R$ ${totalItem.toFixed(2).replace('.', ',')}\n`;
            });
            if (isGift) text += `\n🎁 *Embalagem para Presente:* Solicitada\n`;
            text += `\n💰 *Total:* R$ ${subtotal.toFixed(2).replace('.', ',')}\n\nOlá, gostaria de confirmar este pedido!`;
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        fetchProducts();
    </script>
</body>
</html>
