<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Loja do Helcinho</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js para Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script>
        const SUPABASE_URL = 'https://xslatpupelivsxxodtpg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_5mfnRVIWm0WGT4fD0Zqzhw_Ucl8zTtT';
        let supabaseClient = null;

        try {
            if (typeof supabase !== 'undefined' && SUPABASE_URL) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.warn("Modo offline / localStorage ativo.");
        }

        let products = [];
        let myChart = null;

        // Função global de navegação blindada
        window.switchTab = function(tabId) {
            try {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.className = "tab-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-semibold text-marromCafe hover:bg-rosegold/10 transition";
                });
                
                const targetTab = document.getElementById(`tab-${tabId}`);
                const targetBtn = document.getElementById(`btn-${tabId}`);
                
                if (targetTab) targetTab.classList.remove('hidden');
                if (targetBtn) targetBtn.className = "tab-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-semibold bg-verdePetroleo text-white transition shadow-sm";
                
                if(tabId === 'dashboard') try { loadDashboard(); } catch(e){}
                if(tabId === 'pedidos') try { loadPedidos(); } catch(e){}
                if(tabId === 'produtos') { try { loadEstoque(); } catch(e){} try { loadCategoriesSelect(); } catch(e){} }
                if(tabId === 'estoque') try { loadEstoque(); } catch(e){}
                if(tabId === 'clientes') { try { loadClientes(); } catch(e){} try { loadClientesSelect(); } catch(e){} }
                if(tabId === 'crediario') { try { loadCrediario(); } catch(e){} try { loadClientesSelect(); } catch(e){} }
                if(tabId === 'calculadora') try { loadCalcSelect(); } catch(e){}
                if(tabId === 'relatorios') try { loadRelatorios(); } catch(e){}
                if(tabId === 'config') try { loadConfigs(); } catch(e){}
            } catch (err) {
                console.error("Erro ao alternar aba:", err);
            }
        };

        window.switchSubTab = function(subId) {
            try {
                document.querySelectorAll('.subtab-content').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.subtab-btn').forEach(btn => {
                    btn.className = "subtab-btn px-4 py-2 rounded-xl text-xs font-bold bg-gray-100 text-marromCafe hover:bg-rosegold/10 whitespace-nowrap";
                });
                const targetSub = document.getElementById(`subtab-${subId}`);
                const targetSubBtn = document.getElementById(`subbtn-${subId}`);

                if (targetSub) targetSub.classList.remove('hidden');
                if (targetSubBtn) targetSubBtn.className = "subtab-btn px-4 py-2 rounded-xl text-xs font-bold bg-verdePetroleo text-white whitespace-nowrap shadow-sm";
                
                if(subId === 'produtos-ranking') renderRankingProdutos();
                if(subId === 'clientes-analise') renderRankingClientes();
                if(subId === 'crediario-rel') renderRelatorioCrediario();
            } catch (err) {
                console.error("Erro ao alternar sub-aba:", err);
            }
        };

        // Inicialização com garantia de funcionamento do menu lateral
        window.addEventListener('DOMContentLoaded', () => {
            // Associa cliques aos botões do menu lateral via evento seguro
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const onclickAttr = this.getAttribute('onclick');
                    if (onclickAttr) {
                        const match = onclickAttr.match(/'([^']+)'/);
                        if (match && match[1]) {
                            switchTab(match[1]);
                        }
                    }
                });
            });

            // Carregamentos iniciais seguros
            try { loadDashboard(); } catch(e){}
            try { loadConfigs(); } catch(e){}
            try { loadCategoriesSelect(); } catch(e){}
            try { loadClientes(); } catch(e){}
            try { loadClientesSelect(); } catch(e){}
            try { loadEstoque(); } catch(e){}
            try { loadPedidos(); } catch(e){}
        });

        function handleLogout() {
            location.reload();
        }

        // --- GESTÃO DE PEDIDOS ---
        async function loadPedidos() {
            const listEl = document.getElementById('pedidos-list');
            if (!listEl) return;

            let pedidosSupabase = [];
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('pedidos').select('*');
                    if (!error && data) pedidosSupabase = data;
                } catch (err) {}
            }

            let pedidosLocal = [];
            try {
                pedidosLocal = JSON.parse(localStorage.getItem('helcinho_pedidos') || '[]');
            } catch(e) {}

            let mapPedidos = {};
            [...pedidosLocal, ...pedidosSupabase].forEach(p => {
                if (p && p.id) mapPedidos[p.id] = p;
            });
            let pedidos = Object.values(mapPedidos);

            const badgePedidos = document.getElementById('dash-total-pedidos');
            if (badgePedidos) {
                badgePedidos.textContent = pedidos.filter(p => !p.status || p.status === 'Novo').length;
            }

            if (pedidos.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400">Nenhum pedido recebido da loja online.</p>';
                return;
            }

            listEl.innerHTML = pedidos.map((p) => {
                let totalVal = Number(p.valorTotal || p.valortotal || 0);
                let statusAtual = p.status || 'Novo';
                let itensHtml = '';
                
                if (p.itensDetalhados && Array.isArray(p.itensDetalhados) && p.itensDetalhados.length > 0) {
                    itensHtml = p.itensDetalhados.map(item => `
                        <div class="text-gray-600 ml-2">• ${item.qtd || 1}x ${item.nome || 'Produto'} — R$ ${Number(item.preco || 0).toFixed(2).replace('.', ',')} un</div>
                    `).join('');
                } else {
                    itensHtml = `<p class="text-gray-600 font-medium mt-1">Produtos: ${p.produtos || 'Não especificado'}</p>`;
                }

                return `
                    <div class="bg-creme p-4 rounded-xl border border-rosegold/20 text-xs space-y-2">
                        <div class="flex justify-between items-start border-b pb-2">
                            <div>
                                <h4 class="font-bold uppercase text-marromCafe text-sm">Pedido #${p.id} — ${p.data || 'Recente'}</h4>
                                <p class="text-verdePetroleo font-bold text-sm mt-0.5"><i class="fa-solid fa-user mr-1"></i> Cliente: ${p.cliente || p.nomeCliente || 'Não informado'}</p>
                                <div class="mt-1 space-y-1">
                                    ${itensHtml}
                                </div>
                            </div>
                            <span class="font-bold text-base text-verdePetroleo">R$ ${totalVal.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <div class="flex justify-between items-center pt-1">
                            <select onchange="updatePedidoStatus('${p.id}', this.value)" class="bg-white border border-rosegold/30 rounded-lg px-2 py-1 text-xs font-bold text-marromCafe">
                                <option value="Novo" ${statusAtual === 'Novo' ? 'selected' : ''}>Novo</option>
                                <option value="Confirmado" ${statusAtual === 'Confirmado' ? 'selected' : ''}>Confirmado</option>
                                <option value="Em separação" ${statusAtual === 'Em separação' ? 'selected' : ''}>Em separação</option>
                                <option value="Entregue" ${statusAtual === 'Entregue' ? 'selected' : ''}>Entregue</option>
                                <option value="Cancelado" ${statusAtual === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                            </select>
                            <button onclick="deletePedido('${p.id}')" class="text-red-500 hover:text-red-700 font-semibold"><i class="fa-solid fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updatePedidoStatus(id, val) {
            if (supabaseClient) {
                try {
                    await supabaseClient.from('pedidos').update({ status: val }).eq('id', id);
                } catch(e) {}
            }
            let localPedidos = JSON.parse(localStorage.getItem('helcinho_pedidos') || '[]');
            localPedidos = localPedidos.map(p => p.id == id ? {...p, status: val} : p);
            localStorage.setItem('helcinho_pedidos', JSON.stringify(localPedidos));
            loadDashboard();
        }

        async function deletePedido(id) {
            if(!confirm('Deseja realmente excluir este pedido?')) return;
            if (supabaseClient) {
                try {
                    await supabaseClient.from('pedidos').delete().eq('id', id);
                } catch(e) {}
            }
            let localPedidos = JSON.parse(localStorage.getItem('helcinho_pedidos') || '[]');
            localPedidos = localPedidos.filter(p => p.id != id);
            localStorage.setItem('helcinho_pedidos', JSON.stringify(localPedidos));

            alert('Pedido excluído com sucesso!');
            loadPedidos();
            loadDashboard();
        }

        // --- DASHBOARD & CONTAS ATRASADAS ---
        async function loadDashboard() {
            let credSupabase = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('crediario').select('*');
                    if (data) credSupabase = data;
                } catch(e) {}
            }
            let credLocal = [];
            try {
                credLocal = JSON.parse(localStorage.getItem('helcinho_crediario_avancado') || '[]');
            } catch(e) {}

            let mapCred = {};
            [...credLocal, ...credSupabase].forEach(v => {
                if(v && v.id) mapCred[v.id] = v;
            });
            let credList = Object.values(mapCred);

            let pedidosSupabase = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('pedidos').select('*');
                    if (data) pedidosSupabase = data;
                } catch(e) {}
            }
            let pedidosLocal = [];
            try {
                pedidosLocal = JSON.parse(localStorage.getItem('helcinho_pedidos') || '[]');
            } catch(e) {}

            let mapPed = {};
            [...pedidosLocal, ...pedidosSupabase].forEach(p => {
                if(p && p.id) mapPed[p.id] = p;
            });
            let pedidos = Object.values(mapPed);

            let totalAberto = 0, totalAtrasado = 0;
            let atrasadasArr = [];
            const hoje = new Date().toISOString().split('T')[0];

            credList.forEach((venda) => {
                (venda.parcelas || []).forEach((p) => {
                    let saldo = Number(p.valorOriginal || p.valor || 0) - Number(p.valorPago || 0);
                    if (saldo > 0) {
                        totalAberto += saldo;
                        if (p.vencimento && p.vencimento < hoje) {
                            totalAtrasado += saldo;
                            let diffTime = Math.abs(new Date(hoje) - new Date(p.vencimento));
                            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                            atrasadasArr.push({ cliente: venda.cliente || venda.nomeCliente, parcela: p.numero, saldo, vencimento: p.vencimento, diasAtraso: diffDays });
                        }
                    }
                });
            });

            const elAberto = document.getElementById('dash-total-aberto');
            const elAtrasado = document.getElementById('dash-total-atrasado');
            const elPedidos = document.getElementById('dash-total-pedidos');
            const atrasadasBadge = document.getElementById('atrasadas-badge');
            const atrasadasListEl = document.getElementById('atrasadas-list');

            if (elAberto) elAberto.textContent = `R$ ${totalAberto.toFixed(2).replace('.', ',')}`;
            if (elAtrasado) elAtrasado.textContent = `R$ ${totalAtrasado.toFixed(2).replace('.', ',')}`;
            if (elPedidos) elPedidos.textContent = pedidos.filter(p => !p.status || p.status === 'Novo').length;
            if (atrasadasBadge) atrasadasBadge.textContent = `${atrasadasArr.length} parcelas`;
            
            if (atrasadasListEl) {
                atrasadasListEl.innerHTML = atrasadasArr.length === 0 ? 
                    '<p class="text-xs text-gray-400">Nenhuma conta atrasada no momento.</p>' : 
                    atrasadasArr.map(item => {
                        const isCritico = item.diasAtraso >= 5;
                        const bgClass = isCritico ? 'bg-red-100 border-red-300' : 'bg-red-50 border-red-200';
                        const badgeCritico = isCritico ? '<span class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-bold ml-2">⚠️ +5 Dias (Crítico)</span>' : '';
                        return `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center ${bgClass} p-3 rounded-xl border text-xs gap-2">
                                <div>
                                    <b>${item.cliente || 'Cliente'}</b> - Parc ${item.parcela} (R$ ${item.saldo.toFixed(2).replace('.', ',)}) 
                                    <br><span class="text-red-700 font-semibold">${item.diasAtraso} dias em atraso</span> (Venc: ${String(item.vencimento).split('-').reverse().join('/')}) ${badgeCritico}
                                </div>
                                <button onclick="cobrarWhatsApp('${item.cliente || ''}', '${item.parcela}', ${item.saldo}, ${item.diasAtraso}, '${item.vencimento}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 transition shrink-0">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> Enviar Cobrança
                                </button>
                            </div>
                        `;
                    }).join('');
            }
        }

        // --- GESTÃO DE PRODUTOS ---
        async function loadEstoque() {
            const listEl = document.getElementById('estoque-list');
            if (!listEl) return;
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('produtos').select('*');
                    if (!error && data) {
                        products = data;
                        localStorage.setItem('helcinho_produtos', JSON.stringify(products));
                    } else {
                        products = JSON.parse(localStorage.getItem('helcinho_produtos') || '[]');
                    }
                } catch(e) {
                    products = JSON.parse(localStorage.getItem('helcinho_produtos') || '[]');
                }
            } else {
                products = JSON.parse(localStorage.getItem('helcinho_produtos') || '[]');
            }

            if (products.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400">Nenhum produto cadastrado na nuvem.</p>';
                return;
            }

            listEl.innerHTML = products.map(p => `
                <div class="flex items-center justify-between bg-creme p-3 rounded-xl border border-rosegold/20 text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${p.imagem || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500'}" class="w-10 h-10 object-contain bg-white rounded-lg p-1">
                        <div>
                            <h4 class="font-bold uppercase">${p.nome} (${p.categoria} - ${p.genero || 'Unissex'})</h4>
                            <p class="text-gray-500">R$ ${Number(p.preco || 0).toFixed(2).replace('.', ',')} | Estoque: ${p.estoque_atual ?? 10}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editProduct(${p.id})" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg font-semibold hover:bg-blue-200"><i class="fa-solid fa-pen"></i> Editar</button>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-200"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const productId = document.getElementById('product-id').value;
            const productData = {
                id: productId ? Number(productId) : Date.now(),
                nome: document.getElementById('nome').value,
                sku: document.getElementById('sku').value || null,
                categoria: document.getElementById('categoria').value,
                genero: document.getElementById('genero').value,
                estoque_atual: parseInt(document.getElementById('estoque_atual').value) || 0,
                descricao: document.getElementById('descricao').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem: document.getElementById('imagem-base64').value || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500',
                ativo: true
            };

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('produtos').upsert([productData]);
                    if (error) {
                        alert("Erro ao salvar na nuvem: " + error.message);
                        return;
                    }
                } catch(e) {}
            }

            let localProducts = JSON.parse(localStorage.getItem('helcinho_produtos') || '[]');
            if (productId) {
                localProducts = localProducts.map(p => p.id == productId ? productData : p);
            } else {
                localProducts.push(productData);
            }
            localStorage.setItem('helcinho_produtos', JSON.stringify(localProducts));

            alert(productId ? 'Produto atualizado com sucesso na nuvem!' : 'Produto cadastrado com sucesso na nuvem!');
            resetProductForm();
            loadEstoque();
            loadCategoriesSelect();
        }

        function editProduct(id) {
            const p = products.find(item => item.id == id);
            if (!p) return;
            document.getElementById('product-id').value = p.id;
            document.getElementById('nome').value = p.nome || '';
            document.getElementById('sku').value = p.sku || '';
            loadCategoriesSelect();
            document.getElementById('categoria').value = p.categoria || '';
            document.getElementById('genero').value = p.genero || 'Unissex';
            document.getElementById('estoque_atual').value = p.estoque_atual ?? 10;
            document.getElementById('descricao').value = p.descricao || '';
            document.getElementById('preco').value = p.preco || '';
            document.getElementById('imagem-base64').value = p.imagem || '';
            document.getElementById('form-title').textContent = 'Editar Produto (' + p.nome + ')';
            document.getElementById('product-btn-submit').textContent = 'Atualizar Produto';
            switchTab('produtos');
        }

        async function deleteProduct(id) {
            if(!confirm('Excluir produto da nuvem?')) return;
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
                    if (error) {
                        alert("Erro ao excluir na nuvem: " + error.message);
                        return;
                    }
                } catch(e) {}
            }
            products = products.filter(p => p.id != id);
            localStorage.setItem('helcinho_produtos', JSON.stringify(products));
            loadEstoque();
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('imagem-base64').value = '';
            document.getElementById('form-title').textContent = 'Cadastrar / Editar Produto';
            document.getElementById('product-btn-submit').textContent = 'Salvar Produto na Nuvem';
            loadCategoriesSelect();
        }

        // --- CLIENTES ---
        async function saveClient(e) {
            e.preventDefault();
            const clienteId = document.getElementById('client-index').value;
            const clienteData = {
                id: clienteId ? clienteId : 'CLI-' + Date.now(),
                nome: document.getElementById('cli-nome').value,
                whatsapp: document.getElementById('cli-zap').value,
                endereco: document.getElementById('cli-end').value
            };

            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient.from('clientes').upsert([clienteData]);
                    if (error) {
                        alert("Erro ao salvar cliente na nuvem: " + error.message);
                        return;
                    }
                } catch(e) {}
            }

            alert(clienteId ? 'Cliente atualizado com sucesso!' : 'Cliente cadastrado com sucesso!');
            resetClientForm();
            loadClientes();
            loadClientesSelect();
        }

        async function loadClientes() {
            const list = document.getElementById('clientes-list');
            if (!list) return;
            let clientes = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('clientes').select('*').order('nome', { ascending: true });
                    if (data) clientes = data;
                } catch(e) {}
            }
            if (clientes.length === 0) {
                clientes = JSON.parse(localStorage.getItem('helcinho_clientes') || '[]');
            }

            list.innerHTML = clientes.length === 0 ? '<p class="text-xs text-gray-400">Nenhum cliente cadastrado.</p>' : clientes.map((c) => `
                <div class="bg-creme p-3 rounded-xl border border-rosegold/20 text-xs flex justify-between items-center">
                    <div>
                        <h4 class="font-bold uppercase text-marromCafe flex items-center gap-2">
                            <button onclick="editClient('${c.id}')" class="text-blue-600 hover:text-blue-800" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            ${c.nome}
                        </h4>
                        <p class="text-gray-500">${c.whatsapp || c.cli_zap} | ${c.endereco || c.cli_end}</p>
                    </div>
                    <button onclick="deleteClient('${c.id}')" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        async function loadClientesSelect() {
            const selectEl = document.getElementById('cred-cliente');
            if (!selectEl) return;
            let clientes = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('clientes').select('*').order('nome', { ascending: true });
                    if (data) clientes = data;
                } catch(e) {}
            }
            if (clientes.length === 0) {
                clientes = JSON.parse(localStorage.getItem('helcinho_clientes') || '[]');
            }
            selectEl.innerHTML = '<option value="">Selecione um cliente...</option>' + clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
        }

        async function editClient(id) {
            let clientes = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('clientes').select('*').eq('id', id);
                    if (data && data.length > 0) clientes = data;
                } catch(e) {}
            }
            const c = clientes[0] || JSON.parse(localStorage.getItem('helcinho_clientes') || '[]').find(item => item.id == id);
            if(!c) return;

            document.getElementById('client-index').value = c.id;
            document.getElementById('cli-nome').value = c.nome || '';
            document.getElementById('cli-zap').value = c.whatsapp || c.cli_zap || '';
            document.getElementById('cli-end').value = c.endereco || c.cli_end || '';
            document.getElementById('client-form-title').textContent = 'Editar Cliente (' + c.nome + ')';
            document.getElementById('client-btn-submit').textContent = 'Atualizar Cliente na Nuvem';
        }

        function resetClientForm() {
            document.getElementById('client-index').value = '';
            document.getElementById('cli-nome').value = '';
            document.getElementById('cli-zap').value = '';
            document.getElementById('cli-end').value = '';
            document.getElementById('client-form-title').textContent = 'Cadastrar Novo Cliente';
            document.getElementById('client-btn-submit').textContent = 'Salvar Cliente na Nuvem';
        }

        async function deleteClient(id) {
            if(!confirm('Excluir cliente da nuvem?')) return;
            if (supabaseClient) {
                try {
                    await supabaseClient.from('clientes').delete().eq('id', id);
                } catch(e) {}
            }
            loadClientes();
            loadClientesSelect();
        }

        // --- CREDIÁRIO ---
        async function saveCrediario(e) {
            e.preventDefault();
            const cliente = document.getElementById('cred-cliente').value;
            const produtos = document.getElementById('cred-produtos').value;
            const valorTotal = parseFloat(document.getElementById('cred-valor').value);
            const qtdParcelas = parseInt(document.getElementById('cred-parcelas').value);
            const dataInicialStr = document.getElementById('cred-vencimento-inicial').value;

            if(!cliente) return alert('Selecione um cliente!');
            if(!dataInicialStr) return alert('Informe a data do primeiro vencimento!');

            const valorParcela = Number((valorTotal / qtdParcelas).toFixed(2));
            let parcelas = [];
            let dataBase = new Date(dataInicialStr + 'T00:00:00');

            for (let i = 1; i <= qtdParcelas; i++) {
                parcelas.push({
                    id: Date.now() + i,
                    numero: `${i}/${qtdParcelas}`,
                    valorOriginal: valorParcela,
                    valorPago: 0,
                    vencimento: dataBase.toISOString().split('T')[0],
                    status: 'Pendente'
                });
                dataBase.setDate(dataBase.getDate() + 30);
            }

            const vendaCrediario = {
                id: 'CRED-' + Date.now(),
                cliente,
                produtos,
                valorTotal,
                parcelas
            };

            if (supabaseClient) {
                try {
                    await supabaseClient.from('crediario').upsert([vendaCrediario]);
                } catch (error) {}
            }

            let credList = JSON.parse(localStorage.getItem('helcinho_crediario_avancado') || '[]');
            credList.push(vendaCrediario);
            localStorage.setItem('helcinho_crediario_avancado', JSON.stringify(credList));

            alert('Venda parcelada gerada e salva na nuvem com sucesso!');
            e.target.reset();
            loadCrediario();
            loadDashboard();
        }

        async function loadCrediario() {
            const list = document.getElementById('crediario-list');
            if (!list) return;
            let credList = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('crediario').select('*');
                    if (data) credList = data;
                } catch(e) {}
            }
            if (credList.length === 0) {
                credList = JSON.parse(localStorage.getItem('helcinho_crediario_avancado') || '[]');
            }

            list.innerHTML = credList.length === 0 ? '<p class="text-xs text-gray-400">Nenhum contrato ativo.</p>' : credList.map((venda, vIndex) => `
                <div class="bg-creme p-4 rounded-xl border border-rosegold/20 space-y-3 text-xs">
                    <div class="flex justify-between items-center font-bold border-b pb-1">
                        <span>${venda.cliente} — R$ ${Number(venda.valorTotal || 0).toFixed(2).replace('.', ',')} (${venda.produtos})</span>
                        <button onclick="deleteContrato('${venda.id}', ${vIndex})" class="text-red-500 hover:text-red-700">Excluir Venda</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        ${(venda.parcelas || []).map((p, pIndex) => {
                            const hoje = new Date().toISOString().split('T')[0];
                            let saldo = p.valorOriginal - p.valorPago;
                            let statusTxt = p.status;
                            if (saldo <= 0) statusTxt = 'Paga';
                            else if (p.vencimento < hoje) statusTxt = 'ATRASADA';
                            return `
                                <div class="p-2 rounded border bg-white flex flex-col justify-between">
                                    <div>
                                        <b>Parc ${p.numero}</b> | R$ ${saldo.toFixed(2).replace('.', ',')}<br>
                                        Venc: ${p.vencimento.split('-').reverse().join('/')}<br>
                                        Status: <span class="${statusTxt === 'ATRASADA' ? 'text-red-600 font-bold' : ''}">${statusTxt}</span>
                                    </div>
                                    ${saldo > 0 ? `<button onclick="baixarParcela('${venda.id}', ${pIndex})" class="mt-2 bg-verdePetroleo text-white py-1 rounded text-[10px] font-semibold">Baixar</button>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function baixarParcela(vendaId, pIndex) {
            let credList = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('crediario').select('*');
                    if (data) credList = data;
                } catch(e) {}
            }
            if (credList.length === 0) {
                credList = JSON.parse(localStorage.getItem('helcinho_crediario_avancado') || '[]');
            }

            let venda = credList.find(v => v.id == vendaId) || credList[vendaId];
            if (!venda) return;

            let parcela = venda.parcelas[pIndex];
            let saldo = parcela.valorOriginal - parcela.valorPago;
            let valorPagoStr = prompt(`Valor a baixar (Saldo: R$ ${saldo.toFixed(2)})`, saldo);
            if(!valorPagoStr) return;
            let valorPago = parseFloat(valorPagoStr);
            if(isNaN(valorPago) || valorPago <= 0) return alert('Valor inválido!');
            
            parcela.valorPago += valorPago;
            parcela.status = parcela.valorPago >= parcela.valorOriginal ? 'Paga' : 'Parcial';

            if (supabaseClient) {
                try { await supabaseClient.from('crediario').upsert([venda]); } catch(e){}
            }
            localStorage.setItem('helcinho_crediario_avancado', JSON.stringify(credList));
            loadCrediario();
            loadDashboard();
            alert('Baixa registrada com sucesso!');
        }

        async function deleteContrato(vendaId, vIndex) {
            if(!confirm('Deseja excluir este contrato?')) return;
            if (supabaseClient) {
                try { await supabaseClient.from('crediario').delete().eq('id', vendaId); } catch(e){}
            }
            let credList = JSON.parse(localStorage.getItem('helcinho_crediario_avancado') || '[]');
            credList.splice(vIndex, 1);
            localStorage.setItem('helcinho_crediario_avancado', JSON.stringify(credList));
            loadCrediario();
            loadDashboard();
        }

        // --- CATEGORIAS ---
        async function loadCategoriesSelect() {
            const select = document.getElementById('categoria');
            if(!select) return;
            let categoriasPadrao = ["Perfumes", "Cremes", "Sabonetes", "Presentes"];
            let savedCats = [];
            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('categorias').select('*');
                    if (data) savedCats = data.map(c => c.nome || c.categoria).filter(Boolean);
                } catch(e) {}
            }
            if (savedCats.length === 0) {
                savedCats = JSON.parse(localStorage.getItem('helcinho_categorias_extras') || '[]');
            }
            let catsProdutos = products.map(p => p.categoria).filter(Boolean);
            let todas = [...new Set([...categoriasPadrao, ...savedCats, ...catsProdutos])].sort();
            select.innerHTML = todas.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        async function adicionarNovaCategoria() {
            let nova = prompt("Digite o nome da nova categoria:");
            if(nova && nova.trim() !== '') {
                nova = nova.trim();
                if (supabaseClient) {
                    try { await supabaseClient.from('categorias').upsert([{ id: 'CAT-' + Date.now(), nome: nova }]); } catch(e){}
                }
                let savedCats = JSON.parse(localStorage.getItem('helcinho_categorias_extras') || '[]');
                if(!savedCats.includes(nova)) { 
                    savedCats.push(nova); 
                    localStorage.setItem('helcinho_categorias_extras', JSON.stringify(savedCats)); 
                }
                loadCategoriesSelect();
                document.getElementById('categoria').value = nova;
                alert(`Categoria "${nova}" criada com sucesso!`);
            }
        }

        async function excluirCategoria() {
            const select = document.getElementById('categoria');
            if (!select) return;
            const catSelecionada = select.value;
            let categoriasPadrao = ["Perfumes", "Cremes", "Sabonetes", "Presentes"];

            if (categoriasPadrao.includes(catSelecionada)) {
                alert("As categorias padrão do sistema não podem ser excluídas!");
                return;
            }

            if(!confirm(`Deseja realmente excluir a categoria "${catSelecionada}"?`)) return;

            if (supabaseClient) {
                try { await supabaseClient.from('categorias').delete().eq('nome', catSelecionada); } catch(e){}
            }

            let savedCats = JSON.parse(localStorage.getItem('helcinho_categorias_extras') || '[]');
            savedCats = savedCats.filter(c => c !== catSelecionada);
            localStorage.setItem('helcinho_categorias_extras', JSON.stringify(savedCats));

            loadCategoriesSelect();
            alert(`Categoria "${catSelecionada}" excluída com sucesso!`);
        }

        const imageFileInput = document.getElementById('imagem-file');
        if(imageFileInput) {
            imageFileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(evt) { document.getElementById('imagem-base64').value = evt.target.result; };
                    reader.readAsDataURL(file);
                }
            });
        }

        // Calculadora
        function loadCalcSelect() {
            const calcProd = document.getElementById('calc-produto');
            if (calcProd) {
                calcProd.innerHTML = '<option value="">Selecione...</option>' + products.map(p => `<option value="${p.id}">${p.nome} - R$ ${p.preco}</option>`).join('');
            }
        }
        function loadProductForCalc() {
            const p = products.find(i => i.id == document.getElementById('calc-produto').value);
            if(p) document.getElementById('calc-custo').value = (p.preco * 0.4).toFixed(2);
        }
        function calcularPrecoIdeal() {
            const custo = parseFloat(document.getElementById('calc-custo').value) || 0;
            const margem = parseFloat(document.getElementById('calc-margem').value) || 0;
            const sugerido = custo * (1 + (margem / 100));
            document.getElementById('calc-resultado').classList.remove('hidden');
            document.getElementById('calc-preco-sugerido').textContent = `R$ ${sugerido.toFixed(2).replace('.', ',')}`;
        }
    </script>
