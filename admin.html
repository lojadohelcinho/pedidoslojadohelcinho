<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Loja do Helcinho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creme: '#FDF9F5',
                        rosegold: '#D49B85',
                        marromCafe: '#3E2723',
                        verdePetroleo: '#008B74',
                        verdeHover: '#006D5B'
                    },
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-creme text-marromCafe font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-rosegold/20 shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border border-rosegold flex items-center justify-center bg-creme">
                <i class="fa-solid fa-gear text-rosegold text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-marromCafe">Painel Administrativo</h1>
                <p class="text-xs text-rosegold">Gerencie seus produtos e WhatsApp</p>
            </div>
        </div>
        <a href="index.html" class="bg-verdePetroleo text-white px-4 py-2 rounded-xl text-xs font-semibold hover:bg-verdeHover transition flex items-center gap-2">
            <i class="fa-solid fa-store"></i> Ver a Loja
        </a>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-6 w-full flex-grow space-y-6">
        <!-- WhatsApp -->
        <div class="bg-white p-6 rounded-2xl border border-rosegold/20 shadow-sm space-y-4">
            <h2 class="font-bold text-base text-marromCafe"><i class="fa-brands fa-whatsapp text-green-600 mr-2"></i> Número do WhatsApp para Pedidos</h2>
            <div class="flex gap-3">
                <input type="text" id="whatsapp-input" placeholder="Ex: 5514999999999" class="flex-grow bg-creme border border-rosegold/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-verdePetroleo">
                <button onclick="saveWhatsApp()" class="bg-verdePetroleo hover:bg-verdeHover text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition">Salvar Número</button>
            </div>
        </div>

        <!-- Cadastrar Produto -->
        <div class="bg-white p-6 rounded-2xl border border-rosegold/20 shadow-sm space-y-4">
            <h2 class="font-bold text-base text-marromCafe"><i class="fa-solid fa-plus-circle text-rosegold mr-2"></i> Cadastrar Novo Produto</h2>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="hidden" id="product-id">
                <div>
                    <label class="block text-xs font-semibold mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Categoria</label>
                    <select id="categoria" class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                        <option value="Masculino">Masculino</option>
                        <option value="Feminino">Feminino</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold mb-1">Descrição / Detalhes</label>
                    <input type="text" id="descricao" required class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Preço Atual (R$)</label>
                    <input type="number" step="0.01" id="preco" required class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Preço Antigo / Riscado (Opcional)</label>
                    <input type="number" step="0.01" id="preco_antigo" class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Link da Imagem (URL)</label>
                    <input type="url" id="imagem" required class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Desconto (Ex: -50%)</label>
                    <input type="text" id="desconto" class="w-full bg-creme border border-rosegold/30 rounded-xl px-4 py-2 text-sm">
                </div>
                <div class="sm:col-span-2 flex gap-3 pt-2">
                    <button type="submit" class="bg-verdePetroleo hover:bg-verdeHover text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition">Salvar Produto</button>
                    <button type="button" onclick="resetForm()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-semibold">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista -->
        <div class="bg-white p-6 rounded-2xl border border-rosegold/20 shadow-sm space-y-4">
            <h2 class="font-bold text-base text-marromCafe">📦 Produtos Cadastrados</h2>
            <div id="admin-products-list" class="space-y-3"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = npm install @supabase/supabase-js @supabase/ssr;
        const SUPABASE_ANON_KEY = sb_publishable_5mfnRVIWm0WGT4fD0Zqzhw_Ucl8zTtT;
        
        let supabaseClient = null;
        try {
            if (SUPABASE_URL !== 'SUA_SUPABASE_URL_AQUI') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) { console.warn("Supabase não configurado."); }

        document.getElementById('whatsapp-input').value = localStorage.getItem('helcinho_whatsapp') || '';

        function saveWhatsApp() {
            const num = document.getElementById('whatsapp-input').value;
            localStorage.setItem('helcinho_whatsapp', num);
            alert('Número de WhatsApp salvo com sucesso!');
        }

        async function loadAdminProducts() {
            const listEl = document.getElementById('admin-products-list');
            try {
                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('produtos').select('*');
                    if (error) throw error;
                    
                    if (!data || data.length === 0) {
                        listEl.innerHTML = '<p class="text-xs text-gray-400">Nenhum produto cadastrado.</p>';
                        return;
                    }

                    listEl.innerHTML = data.map(p => `
                        <div class="flex items-center justify-between bg-creme p-3 rounded-xl border border-rosegold/20">
                            <div class="flex items-center gap-3">
                                <img src="${p.imagem}" class="w-12 h-12 object-contain bg-white rounded-lg p-1">
                                <div>
                                    <h4 class="font-bold text-xs uppercase">${p.nome} (${p.categoria})</h4>
                                    <p class="text-xs text-gray-500">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-xs hover:bg-red-600"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                listEl.innerHTML = '<p class="text-xs text-red-500">Erro ao carregar produtos do Supabase.</p>';
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const product = {
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                descricao: document.getElementById('descricao').value,
                preco: parseFloat(document.getElementById('preco').value),
                preco_antigo: document.getElementById('preco_antigo').value ? parseFloat(document.getElementById('preco_antigo').value) : null,
                imagem: document.getElementById('imagem').value,
                desconto: document.getElementById('desconto').value || null
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('produtos').insert([product]);
                if (error) {
                    alert('Erro ao salvar no Supabase: ' + error.message);
                    return;
                }
                alert('Produto cadastrado com sucesso!');
                resetForm();
                loadAdminProducts();
            } else {
                alert('Configure suas chaves do Supabase no código para salvar.');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Deseja realmente excluir este produto?')) return;
            if (supabaseClient) {
                const { error } = await supabaseClient.from('produtos').delete().eq('id', id);
                if (error) {
                    alert('Erro ao excluir: ' + error.message);
                    return;
                }
                loadAdminProducts();
            }
        }

        function resetForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
        }

        loadAdminProducts();
    </script>
</body>
</html>
